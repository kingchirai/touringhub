<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teamwrk Touring Results</title><style>body{margin:0;background:#f4f3f0;color:#151515;font:15px Arial}.wrap{max-width:1200px;margin:auto;padding:28px}.top,.head{display:flex;justify-content:space-between;gap:15px}.top{border-bottom:1px solid #ddd;padding-bottom:20px;font-weight:bold}.live{background:#d9f4e2;color:#176b37;padding:8px 12px;border-radius:20px;font-size:12px}.ey{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#777;font-weight:bold}h1{font-size:44px;letter-spacing:-.06em}.stats,.cards,.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#ddd}.stats div,.summary div,.card{background:#fff;padding:18px}.stats b,.summary b{display:block;font-size:27px;margin-top:7px}.cards{grid-template-columns:repeat(3,1fr);background:none;gap:12px}.card{border:1px solid #ddd;text-align:left;cursor:pointer;min-height:150px}.card h3{font-size:21px;margin:10px 0}.card p{color:#777;margin:0}.card strong{display:block;margin-top:20px}dialog{width:min(980px,calc(100vw - 24px));border:0;padding:0;box-shadow:0 20px 60px #0005}.bar{padding:14px 20px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;background:#fff}.bar button{border:0;padding:10px;background:#151515;color:white;font-weight:bold}.bar .x{background:#eee;color:#151515}.report{padding:30px}.rhead{display:flex;justify-content:space-between;border-bottom:3px solid #151515;padding-bottom:16px}.rhead h1{font-size:35px;margin:5px 0}.section{margin-top:28px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:11px 7px;border-bottom:1px solid #ddd;text-align:left}th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#777}td:not(:first-child),th:not(:first-child){text-align:right}.empty{background:#f6f6f5;padding:16px;color:#777}@media(max-width:750px){.stats,.summary{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}h1{font-size:35px}.report{padding:20px}.rhead{display:block}}@media print{.bar{display:none}dialog{display:block!important;position:static;width:100%;box-shadow:none}.report{padding:0}@page{size:A4;margin:13mm}}</style></head><body><main class="wrap"><header class="top"><div>TEAMWRK TOURING<br><small>CAMPAIGN RESULTS HUB</small></div><span class="live" id="live">Loading</span></header><section><span class="ey">Campaign reporting</span><h1>Every current tour, ready to wrap.</h1></section><section class="stats" id="stats"></section><section><div class="head"><h2>Campaign reports</h2><span class="ey" id="updated"></span></div><div class="cards" id="cards"></div></section></main><dialog id="d"><div class="bar"><b>Tour campaign report</b><span><button id="pdf">Download PDF</button> <button class="x" id="x">Close</button></span></div><article class="report" id="r"></article></dialog><script>
const tours=[['MKTO',['mkto']],['Brother Ali',['brother ali','brotherali']],['Dan Does Footy',['dan does footy','ddf']],['28 Days',['28 days','28dayspt2']],['VSPY VSPY',['vspy']],['SOULWAVE',['soulwave']],['You Am I',['you am i','yai']],['harrykirby',['harrykirby','harry kirby']],['Less Than Jake',['less than jake','ltj','circus down under']],['Talib Kweli',['talib kweli','talib']],['The Black Seeds',['the black seeds','black seeds']],['Eric Hutchinson',['eric hutchinson','eric hutch']],['Shapeshifter',['shapeshifter']],['Good Things Festival',['good things']],['Clutch',['clutch']],['Will Sparks',['will sparks','classics','will2027']]];let M={campaigns:[],totals:{}},A=[];const $=x=>document.querySelector(x),cash=x=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0}).format(x||0),n=x=>new Intl.NumberFormat('en-AU').format(x||0),sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0),safe=x=>String(x).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const C=t=>M.campaigns.filter(c=>t[1].some(k=>(c.name||'').toLowerCase().includes(k))),S=t=>A.filter(a=>a.tour===t[0]),K=c=>c.kind||(/event\s*(resp|response)|eventresp/.test(c.name.toLowerCase())?'event':/post\s*eng|engagement/.test(c.name.toLowerCase())?'engagement':'conversion');function draw(){let q=M.totals;$('#stats').innerHTML=[['Meta spend',cash(q.spend)],['Purchase value',cash(q.revenue)],['Purchases',n(q.purchases)],['ROAS',((q.revenue/q.spend)||0).toFixed(2)+'x']].map(x=>`<div><span class="ey">${x[0]}</span><b>${x[1]}</b></div>`).join('');$('#cards').innerHTML=tours.map((t,i)=>{let c=C(t),a=S(t);return `<button class="card" data-i="${i}"><span class="ey">${c.length} Meta · ${a.length} comms</span><h3>${t[0]}</h3><p>Click for full report</p><strong>${c.length?cash(sum(c,'spend'))+' spent':'No matching Meta campaigns'}</strong></button>`}).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>open(tours[b.dataset.i]))}function metaRow(c){if(K(c)==='event')return `<tr><td>${safe(c.name)}</td><td>${cash(c.spend)}</td><td>${n(c.eventResponses)} event responses</td></tr>`;if(K(c)==='engagement')return `<tr><td>${safe(c.name)}</td><td>${cash(c.spend)}</td><td>${n(c.reach)} reach · ${n(c.interactions)} interactions</td></tr>`;return `<tr><td>${safe(c.name)}</td><td>${cash(c.spend)}</td><td>${cash(c.revenue)} value · ${((c.revenue/c.spend)||0).toFixed(2)}x ROAS · ${n(c.purchases)} purchases</td></tr>`}function tab(rows,type){let z=rows.filter(a=>a.type===type);return z.length?`<table><thead><tr><th>Date</th><th>Send</th><th>Recipients</th>${type==='Email'?'<th>Opens</th><th>Clicks</th>':''}</tr></thead><tbody>${z.map(a=>`<tr><td>${new Date(a.sentAt).toLocaleDateString('en-AU')}</td><td>${safe(a.name)}</td><td>${n(a.recipients)}</td>${type==='Email'?`<td>${n(a.opens)}</td><td>${n(a.clicks)}</td>`:''}</tr>`).join('')}</tbody></table>`:'<div class="empty">No matched '+type+' sends.</div>'}function open(t){let c=C(t),a=S(t),e=a.filter(x=>x.type==='Email'),s=a.filter(x=>x.type==='SMS'),sp=sum(c,'spend'),rv=sum(c,'revenue');$('#r').innerHTML=`<header class="rhead"><div><span class="ey">Teamwrk Touring · campaign report</span><h1>${t[0]}</h1></div><p>All-time Meta results<br>Generated ${new Date().toLocaleDateString('en-AU')}</p></header><section class="summary"><div><span class="ey">Meta spend</span><b>${cash(sp)}</b></div><div><span class="ey">Purchase value</span><b>${cash(rv)}</b></div><div><span class="ey">Conversion ROAS</span><b>${((rv/sp)||0).toFixed(2)}x</b></div><div><span class="ey">Email / SMS sends</span><b>${e.length} / ${s.length}</b></div></section><section class="section"><span class="ey">Meta results</span><h3>Campaign performance</h3>${c.length?`<table><thead><tr><th>Campaign</th><th>Spend</th><th>Result</th></tr></thead><tbody>${c.map(metaRow).join('')}</tbody></table>`:'<div class="empty">No matching Meta campaigns.</div>'}</section><section class="section"><span class="ey">Audience Republic email</span><h3>${e.length} sends · ${n(sum(e,'recipients'))} recipients · ${n(sum(e,'opens'))} opens · ${n(sum(e,'clicks'))} clicks</h3>${tab(a,'Email')}</section><section class="section"><span class="ey">Audience Republic SMS</span><h3>${s.length} sends · ${n(sum(s,'recipients'))} recipients</h3>${tab(a,'SMS')}</section><p class="ey">Event response: spend and responses. Post engagement: spend, reach and interactions. Conversion: purchase value, ROAS and purchases.</p>`;d.showModal()}x.onclick=()=>d.close();pdf.onclick=()=>print();Promise.all([fetch('./data/meta-insights.json').then(x=>x.json()),fetch('./data/audience-republic.json').then(x=>x.json())]).then(([m,a])=>{M=m;A=a.messages||[];live.textContent='Live Meta + Audience Republic';updated.textContent='Meta refreshed '+new Date(m.updatedAt).toLocaleString('en-AU');draw()}).catch(()=>{live.textContent='Data unavailable';draw()});
</script></body></html>
