<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Teamwrk Touring | Campaign Results</title><style>
:root{--red:#ed1c24;--ink:#141414;--muted:#737373;--line:#dedddb;--paper:#f4f3f0;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.shell{max-width:1280px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.mark{width:38px;height:38px;display:grid;place-items:center;background:var(--red);color:#fff;font-weight:900}.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:0}.brand h1{font-size:18px;letter-spacing:-.04em;margin:3px 0 0}.live{font-size:12px;font-weight:bold;background:#e0f4e6;color:#126b35;padding:8px 12px;border-radius:999px}.intro{padding:46px 0 26px}.intro .eyebrow{color:var(--red)}.intro h2{font-size:46px;letter-spacing:-.065em;line-height:.96;max-width:650px;margin:9px 0 12px}.intro p{margin:0;color:var(--muted);font-size:16px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}.stat{background:var(--white);padding:19px}.stat strong{font-size:28px;letter-spacing:-.06em;display:block;margin-top:7px}.stat small{font-size:12px;color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:end;margin:40px 0 14px}.section-head h3{font-size:24px;letter-spacing:-.045em;margin:5px 0 0}.tour-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tour{appearance:none;width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:19px;cursor:pointer;min-height:162px;transition:.15s}.tour:hover,.tour:focus{border-color:var(--ink);transform:translateY(-2px)}.tour .tour-top{display:flex;justify-content:space-between;gap:12px}.tour h4{font-size:20px;letter-spacing:-.045em;margin:8px 0}.tour p{font-size:12px;color:var(--muted);margin:0;line-height:1.45}.badge{font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:bold;color:var(--red);white-space:nowrap}.amount{margin-top:19px;font-size:13px;font-weight:bold}.amount b{font-size:17px;letter-spacing:-.04em}dialog{width:min(940px,calc(100vw - 28px));border:0;padding:0;box-shadow:0 24px 80px #0005;background:#fff}.dialog-bar{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}.dialog-bar button{appearance:none;border:0;background:var(--ink);color:#fff;padding:11px 14px;font-weight:bold;cursor:pointer}.dialog-bar .close{background:#eee;color:#222}.report{padding:34px}.report-title{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid var(--ink);padding-bottom:22px}.report-title h2{margin:6px 0 0;font-size:38px;letter-spacing:-.06em}.report-title p{color:var(--muted);margin:6px 0 0;font-size:13px}.report-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:26px 0}.report-metrics div{background:#f7f7f6;padding:17px}.report-metrics strong{font-size:24px;letter-spacing:-.05em;display:block;margin-top:5px}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-size:10px;padding:11px 8px;border-bottom:1px solid var(--line)}td{padding:14px 8px;border-bottom:1px solid var(--line);vertical-align:top}td:not(:first-child),th:not(:first-child){text-align:right}.report-footer{font-size:11px;color:var(--muted);margin-top:24px}.no-results{padding:24px;background:#f7f7f6;color:var(--muted)}@media(max-width:800px){.shell{padding:18px}.intro h2{font-size:37px}.summary,.report-metrics{grid-template-columns:repeat(2,1fr)}.tour-grid{grid-template-columns:1fr}.report{padding:22px}.report-title h2{font-size:31px}.report-title{display:block}.dialog-bar{align-items:flex-start;gap:12px}}@media print{body{background:#fff}.dialog-bar{display:none}dialog{display:block!important;position:static;width:100%;box-shadow:none}.report{padding:0}.report-title h2{font-size:30px}.report-metrics strong{font-size:20px}@page{size:A4;margin:14mm}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><div class="mark">T</div><div><p class="eyebrow">Teamwrk Touring</p><h1>Campaign Results Hub</h1></div></div><span class="live" id="status">Loading Meta data</span></header><section class="intro"><p class="eyebrow">Campaign reporting</p><h2>Every current tour, ready to wrap.</h2><p>Select a tour to view its matching Meta campaigns and save a presentation-ready PDF.</p></section><section class="summary" id="summary"></section><section><div class="section-head"><div><p class="eyebrow">Current tours</p><h3>Campaign reports</h3></div><p class="eyebrow" id="updated"></p></div><div class="tour-grid" id="tours"></div></section></main><dialog id="reportDialog"><div class="dialog-bar"><b>Tour campaign report</b><div><button id="downloadPdf">Download PDF</button><button class="close" id="closeDialog">Close</button></div></div><article class="report" id="report"></article></dialog><script>
const tours=[['MKTO','Australian Tour',['mkto']],['Brother Ali','Australian Tour',['brother ali']],['Dan Does Footy','Podcast',['dan does footy','ddf']],['28 Days','30 Year Anniversary Tour',['28 days']],['VSPY VSPY','40th Anniversary Tour',['vspy']],['SOULWAVE','Dance Competition 2026',['soulwave']],['You Am I',"'Strung Up' Australian Tour",['you am i','yai']],['harrykirby','All Your Friends Tour',['harrykirby','harry kirby']],['Less Than Jake','Circus Down Under Tour',['less than jake','ltj','circus down under']],['Talib Kweli','Australian Tour 2026',['talib kweli']],['The Black Seeds','Australian Tour 2026',['the black seeds','black seeds']],['Eric Hutchinson','Australian Tour',['eric hutchinson']],['Shapeshifter','Soulstice 20th Anniversary Tour',['shapeshifter']],['Good Things Festival','2026',['good things']],['Clutch','Vegetable, Mineral, Man, Or Beast?',['clutch']],['Will Sparks','CLASSICS',['will sparks','classics']]];
const fmt=n=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0}).format(n||0),int=n=>new Intl.NumberFormat('en-AU').format(n||0),sum=(r,k)=>r.reduce((a,x)=>a+(Number(x[k])||0),0),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let meta={campaigns:[],totals:{}};function matching(t){return meta.campaigns.filter(c=>t[2].some(term=>c.name.toLowerCase().includes(term)))}function render(){let x=meta.totals||{};document.querySelector('#summary').innerHTML=[['Meta spend',fmt(x.spend),'All active tour reporting'],['Purchase value',fmt(x.revenue),'Meta-attributed value'],['Purchases',int(x.purchases),'Purchase events'],['Blended ROAS',((x.revenue/x.spend)||0).toFixed(2)+'x','All-time data']].map(a=>`<div class="stat"><p class="eyebrow">${a[0]}</p><strong>${a[1]}</strong><small>${a[2]}</small></div>`).join('');document.querySelector('#tours').innerHTML=tours.map((t,i)=>{let r=matching(t),s=sum(r,'spend'),v=sum(r,'revenue');return `<button class="tour" data-tour="${i}"><div class="tour-top"><span class="badge">${r.length?r.length+' campaign'+(r.length===1?'':'s'):'No match yet'}</span><span>→</span></div><h4>${esc(t[0])}</h4><p>${esc(t[1])}</p><div class="amount">${r.length?`Spend <b>${fmt(s)}</b> &nbsp;·&nbsp; ${((v/s)||0).toFixed(2)}x ROAS`:'Add a matching campaign name in Meta to populate this report.'}</div></button>`}).join('');document.querySelectorAll('[data-tour]').forEach(b=>b.onclick=()=>openTour(tours[b.dataset.tour]))}function openTour(t){let r=matching(t),s=sum(r,'spend'),v=sum(r,'revenue'),p=sum(r,'purchases');document.querySelector('#report').innerHTML=`<header class="report-title"><div><p class="eyebrow">Teamwrk Touring · Meta campaign report</p><h2>${esc(t[0])}</h2><p>${esc(t[1])}</p></div><p>Reporting period: all time<br>Generated ${new Date().toLocaleDateString('en-AU')}</p></header><section class="report-metrics"><div><p class="eyebrow">Spend</p><strong>${fmt(s)}</strong></div><div><p class="eyebrow">Purchase value</p><strong>${fmt(v)}</strong></div><div><p class="eyebrow">ROAS</p><strong>${((v/s)||0).toFixed(2)}x</strong></div><div><p class="eyebrow">Purchases</p><strong>${int(p)}</strong></div></section>${r.length?`<table><thead><tr><th>Meta campaign</th><th>Spend</th><th>Purchase value</th><th>ROAS</th><th>Purchases</th><th>Clicks</th></tr></thead><tbody>${r.map(a=>`<tr><td>${esc(a.name)}</td><td>${fmt(a.spend)}</td><td>${fmt(a.revenue)}</td><td>${((a.revenue/a.spend)||0).toFixed(2)}x</td><td>${int(a.purchases)}</td><td>${int(a.clicks)}</td></tr>`).join('')}</tbody></table>`:'<div class="no-results">No Meta campaigns currently match this tour. A campaign will be added automatically when its name contains a recognised tour term.</div>'}<p class="report-footer">Source: Meta Ads Manager · Campaign-level, all-time results · Generated by Teamwrk Touring Campaign Results Hub</p>`;document.querySelector('#reportDialog').showModal()}document.querySelector('#closeDialog').onclick=()=>document.querySelector('#reportDialog').close();document.querySelector('#downloadPdf').onclick=()=>window.print();fetch('./data/meta-insights.json').then(r=>r.ok?r.json():Promise.reject()).then(d=>{meta=d;document.querySelector('#status').textContent='Live Meta data';document.querySelector('#updated').textContent='Last refreshed '+new Date(d.updatedAt).toLocaleString('en-AU');render()}).catch(()=>{document.querySelector('#status').textContent='Waiting for first Meta refresh';render()});
</script></body></html>
